ServerTokens Prod
ServerSignature Off
<Directory "/var/www/html">
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>
# Deny all non-public code, synthetic QA scripts and handoff artifacts over HTTP.
<DirectoryMatch "^/var/www/html/(private|qa|docs|patches|\.git)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|\.(sql|dump|bak|backup|log|md|txt|json|lock|env|ini)$)">
    Require all denied
</FilesMatch>
Header always set X-Robots-Tag "noindex, nofollow, noarchive"
